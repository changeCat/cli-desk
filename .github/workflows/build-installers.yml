name: Build installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify native runner architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner architecture')"
      - run: npm ci --omit=optional
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run setup:desktop
      - name: Windows full verification
        if: runner.os == 'Windows'
        run: npm run verify:installer
      - name: macOS build verification (native UI acceptance remains manual)
        if: runner.os == 'macOS'
        run: npm test && npm run build && npm run test:rust && npm run package && node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cli-desk-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/CLI-Desk-*-Setup.exe
            release/CLI-Desk-*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-${{ matrix.platform }}-${{ github.sha }}
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
